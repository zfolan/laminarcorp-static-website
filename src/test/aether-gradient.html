<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Aether gradient pixel check</title>
<!-- Run with the Vite dev server at /src/test/aether-gradient.html. -->
<canvas id="sample" width="128" height="64" aria-label="Gradient and uniform line samples"></canvas>
<output id="result" aria-live="polite">Running pixel checks…</output>
<script type="module">
  import { tryAetherGpu } from '../components/stage/aetherGpu.ts'

  const canvas = document.querySelector('#sample')
  const result = document.querySelector('#result')
  try {
    const gpu = tryAetherGpu(canvas)
    if (!gpu) throw new Error('Hardware WebGL is required for this check')
    gpu.begin(128, 64, 0, 0)
    gpu.line(16, 32, 112, 32, 1, 0, 0, 1, 4, 0, 0, 1, 0.5, 12)
    gpu.line(16, 10, 112, 10, 0, 1, 0, 1, 4)
    gpu.flush()

    const gl = canvas.getContext('webgl2') || canvas.getContext('webgl')
    const background = [7, 9, 13]
    const checkPixel = (x, y, expected) => {
      const pixel = new Uint8Array(4)
      gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel)
      if (expected.some((value, i) => Math.abs(value - pixel[i]) > 2)) {
        throw new Error(`Pixel ${x},${y}: expected ${expected}, received ${Array.from(pixel)}`)
      }
    }
    const gradientAt = (x) => {
      const t = (x + 0.5 - 16) / 96
      const alpha = 1 - 0.5 * t
      return [1 - t, 0, t].map((value, i) => Math.round(value * 255 * alpha + background[i] * (1 - alpha)))
    }
    for (const x of [40, 64, 88]) checkPixel(x, 32, gradientAt(x))
    checkPixel(24, 36, background)
    checkPixel(104, 36, gradientAt(104))
    checkPixel(64, 54, [0, 255, 0])
    result.textContent = 'PASS: interpolated color and opacity, tapered width, and uniform lines'
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`
    throw error
  }
</script>
</html>
